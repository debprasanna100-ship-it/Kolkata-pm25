[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kolkata-pm25"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets `pytest` find the package without installing it or setting PYTHONPATH.
pythonpath = ["src"]
testpaths = ["tests"]
